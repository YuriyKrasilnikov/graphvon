[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphvon"
version = "0.1.0"
description = "A scoped start-work preflight for native Codex patches"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
graphvon-preflight = "graphvon.hook:main"
graphvon-issue = "graphvon.issue_check:main"
graphvon-draft = "graphvon.draft_check:main"
graphvon-push = "graphvon.push_check:main"
graphvon-evidence = "graphvon.evidence_check:main"

[tool.setuptools.packages.find]
where = ["src"]
