[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphvon"
version = "0.1.0"
description = "A scoped start-work preflight for native Codex patches"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
graphvon-preflight = "graphvon.hook:main"

[tool.setuptools.packages.find]
where = ["src"]
